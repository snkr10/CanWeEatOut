<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>今日、外食していい？</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <header class="page-header">
    <h1>今日、外食していい？</h1>
  </header>
  <main>
    <div id="judgementCard" class="card judgement-card">
      <span class="icon">⏳</span>
      <p class="message">読み込み中...</p>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">外食に使える自由枠</div>
        <div class="value skeleton" id="freeBudget">読み込み中</div>
      </div>
      <div class="stat-box">
        <div class="label">あと何回外食できるか</div>
        <div class="value skeleton" id="diningPossibleCount">読み込み中</div>
      </div>
      <div class="stat-box">
        <div class="label">直近7日間の外食回数</div>
        <div class="value small skeleton" id="recentDiningCount">読み込み中</div>
      </div>
      <div class="stat-box">
        <div class="label">今月の残高</div>
        <div class="value small skeleton" id="balance">読み込み中</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">今月の内訳</div>
      <div id="breakdown" class="skeleton" style="font-size:14px; color: var(--color-text-sub); line-height:1.8; display:block; width:100%; height:6em;">読み込み中</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><span class="icon">🏠</span>ホーム</a>
    <a href="shopping.html"><span class="icon">🛒</span>買い出し</a>
    <a href="dining.html"><span class="icon">🍽️</span>外食</a>
    <a href="budget.html"><span class="icon">💰</span>予算</a>
    <a href="history.html"><span class="icon">📖</span>履歴</a>
    <a href="settings.html"><span class="icon">⚙️</span>設定</a>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/top.js"></script>
</body>
</html>
