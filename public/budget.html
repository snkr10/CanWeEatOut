<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>食費予算 | 今日、外食していい？</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <header class="page-header">
    <h1>食費予算の設定</h1>
  </header>
  <main>
    <div class="card">
      <div class="section-title" id="monthLabel">今月の予算</div>
      <form class="form" id="budgetForm">
        <div class="field">
          <label for="budgetAmount">今月の食費予算（円）</label>
          <input type="number" id="budgetAmount" inputmode="numeric" min="0" step="1" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">保存する</button>
      </form>
    </div>
    <p style="font-size:13px; color: var(--color-text-sub); padding: 0 4px;">
      月初に未設定の場合は前月と同額が自動で設定されます。実際の予算に合わせてここで修正してください。
    </p>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span>ホーム</a>
    <a href="shopping.html"><span class="icon">🛒</span>買い出し</a>
    <a href="dining.html"><span class="icon">🍽️</span>外食</a>
    <a href="budget.html" class="active"><span class="icon">💰</span>予算</a>
    <a href="history.html"><span class="icon">📖</span>履歴</a>
    <a href="settings.html"><span class="icon">⚙️</span>設定</a>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/budget.js"></script>
</body>
</html>
