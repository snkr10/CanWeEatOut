<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>外食記録 | 今日、外食していい？</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-record-type="dining">
<div class="app">
  <header class="page-header">
    <h1>外食記録</h1>
  </header>
  <main>
    <div class="card">
      <div class="section-title" id="formTitle">新規登録</div>
      <form class="form" id="recordForm">
        <input type="hidden" id="recordId" value="" />
        <div class="field">
          <label for="recordDate">日付</label>
          <input type="date" id="recordDate" required />
        </div>
        <div class="field">
          <label for="recordAmount">金額（円）</label>
          <input type="number" id="recordAmount" inputmode="numeric" min="0" step="1" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">登録する</button>
        <button type="button" class="btn btn-secondary btn-block" id="cancelEditBtn" style="display:none;">編集をキャンセル</button>
      </form>
    </div>

    <div class="section-title">今月の記録</div>
    <div class="card">
      <ul class="record-list" id="recordList"></ul>
      <div class="empty-state" id="emptyState" style="display:none;">まだ記録がありません</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span>ホーム</a>
    <a href="shopping.html"><span class="icon">🛒</span>買い出し</a>
    <a href="dining.html" class="active"><span class="icon">🍽️</span>外食</a>
    <a href="budget.html"><span class="icon">💰</span>予算</a>
    <a href="history.html"><span class="icon">📖</span>履歴</a>
    <a href="settings.html"><span class="icon">⚙️</span>設定</a>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/records.js"></script>
</body>
</html>
